<style>
body {{ margin: 0; }}
img {{ max-width: 100%; }}
[hidden] {{ display: none !important; }}
:root {
  --paper: #eef1f5;
  --card: #ffffff;
  --ink: #131a26;
  --muted: #566074;
  --rule: #cfd6e0;
  --us: #2f4b8a;
  --us-soft: #e3e9f5;
  --my: #c98f00;
  --my-soft: #fbf1d6;
  --my-ink: #7a5600;
  --red: #b3261e;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f141c; --card: #171e2a; --ink: #e7ebf2; --muted: #9aa5b8; --rule: #2a3444;
    --us: #8fa8e0; --us-soft: #1c2740; --my: #f0b92e; --my-soft: #2c2511; --my-ink: #f0c65a; --red: #ef6b62;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f141c; --card: #171e2a; --ink: #e7ebf2; --muted: #9aa5b8; --rule: #2a3444;
  --us: #8fa8e0; --us-soft: #1c2740; --my: #f0b92e; --my-soft: #2c2511; --my-ink: #f0c65a; --red: #ef6b62;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.55 var(--body);
  padding-inline: 16px;
  padding-block: 0 64px;
}
.wrap { max-width: 1120px; margin-inline: auto; }

header { padding-block: 56px 32px; display: grid; gap: 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.lang button { font: 700 12px/1 var(--mono); border: 0; background: transparent; color: var(--muted); padding: 7px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lang button:focus-visible { outline: 2px solid var(--my); outline-offset: 2px; }
.kicker { font: 700 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 {
  font: 800 clamp(40px, 7vw, 84px)/.95 var(--display);
  letter-spacing: -.03em; margin: 0; text-wrap: balance;
}
h1 .hl { color: var(--my); }
.lede { max-width: 60ch; margin: 0; color: var(--muted); font-size: 19px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 8px; font: 500 13px/1 var(--mono); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 28px; }
.filters button {
  font: 500 13px/1 var(--mono); color: var(--ink); background: transparent;
  border: 1px solid var(--rule); border-radius: 999px; padding: 9px 14px; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters button:focus-visible, .card a:focus-visible { outline: 2px solid var(--my); outline-offset: 2px; }

/* Timeline */
.timeline { position: relative; display: grid; gap: 40px; }
.timeline::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
  transform: translateX(-1px);
  background: linear-gradient(var(--us) 0 50%, var(--my) 50% 100%);
  background-size: 2px 16px; opacity: .45;
}
.row { display: grid; grid-template-columns: 1fr 104px 1fr; align-items: start; }
.year {
  grid-column: 2; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  justify-self: center; z-index: 1;
  font: 700 18px/1 var(--mono); font-variant-numeric: tabular-nums;
  background: var(--ink); color: var(--paper); padding: 10px 12px; border-radius: 6px;
}
.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
  overflow: hidden; display: grid;
}
.card.us { grid-column: 1; grid-row: 1; }
.card.my { grid-column: 3; grid-row: 1; }
.card figure { margin: 0; position: relative; aspect-ratio: 16 / 10; background: var(--rule); overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.us img { filter: grayscale(.15); }
.card img.contain { object-fit: contain; background: #fff; padding: 8px; }
.flag {
  position: absolute; left: 12px; top: 12px;
  font: 700 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  padding: 7px 9px; border-radius: 4px;
}
.us .flag { background: var(--us); color: #fff; }
.my .flag { background: var(--my); color: #1a1300; }
.body { padding: 18px 20px 20px; display: grid; gap: 8px; }
.date { font: 500 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card h2 { font: 800 24px/1.12 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.card p { margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.facts span {
  font: 500 12px/1 var(--mono); padding: 6px 8px; border-radius: 4px;
  background: var(--my-soft); color: var(--my-ink); font-variant-numeric: tabular-nums;
}
.us .facts span { background: var(--us-soft); color: var(--us); }

/* Age comparison */
.ages { display: grid; gap: 10px; padding: 20px; margin-top: 12px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; }
.ages h3 { margin: 0 0 4px; font: 800 20px/1.2 var(--display); }
.line { position: relative; height: 14px; margin-top: 44px; margin-bottom: 48px; border-radius: 7px; overflow: visible; }
.seg { position: absolute; top: 0; bottom: 0; }
.seg.us { background: var(--us); border-radius: 7px 0 0 7px; }
.seg.my { background: var(--my); border-radius: 0 7px 7px 0; }
.marker { position: absolute; top: -10px; bottom: -10px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; }
.marker span { position: absolute; right: -2px; white-space: nowrap; text-align: right; font: 500 13px/1.3 var(--mono); color: var(--muted); }
.marker .top { bottom: calc(100% + 6px); font-weight: 700; color: var(--ink); font-family: var(--display); font-size: 16px; }
.marker .bottom { top: calc(100% + 6px); }
.marker b { display: block; font-weight: 700; color: var(--ink); }
.end { position: absolute; top: calc(100% + 16px); font: 500 12px/1 var(--mono); color: var(--muted); }
.end.start { left: 0; }
.end.finish { right: 0; }

/* Era dividers */
.era { display: grid; justify-items: center; gap: 4px; text-align: center; padding-block: 8px; position: relative; z-index: 1; }
.era strong { font: 800 clamp(22px, 3vw, 30px)/1.1 var(--display); background: var(--paper); padding-inline: 12px; text-wrap: balance; }
.era span { font: 500 12px/1.3 var(--mono); color: var(--muted); background: var(--paper); padding-inline: 12px; letter-spacing: .06em; text-transform: uppercase; }

.film {
  display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; margin-top: 4px; padding: 10px; border-radius: 6px;
  background: var(--us-soft); color: var(--ink); text-decoration: none; font: 600 15px/1.3 var(--body);
}
.film img { width: 64px; height: 96px; object-fit: cover; border-radius: 3px; display: block; box-shadow: 0 1px 3px #0003; }
.film div { display: grid; gap: 4px; }
.film span { font: 700 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--us); }
.film em { font: 500 12px/1.3 var(--mono); font-style: normal; color: var(--muted); }
.film:hover { text-decoration: underline; }
.gap { display: inline-block; margin-left: 6px; padding: 3px 6px; border-radius: 4px; background: var(--my); color: #1a1300; font-weight: 700; }
.more { font: 500 13px/1 var(--mono); color: var(--muted); text-decoration: none; margin-top: 4px; justify-self: start; }
.more:hover { color: var(--ink); text-decoration: underline; }

footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; max-width: 70ch; }

/* Compact paired card (phones) */
.pair { display: none; }
@media (max-width: 760px) {
  .timeline { gap: 20px; }
  .timeline::before { left: 9px; width: 3px; transform: none; background: linear-gradient(var(--us), var(--my)); opacity: .6; border-radius: 2px; }
  .row { grid-template-columns: 1fr; row-gap: 8px; position: relative; padding-left: 30px; }
  .row::before {
    content: ""; position: absolute; left: 3px; top: 7px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--paper); border: 3px solid var(--ink); box-sizing: border-box;
  }
  .year { grid-column: 1; grid-row: 1; justify-self: start; font-size: 15px; padding: 7px 10px; }
  .card { display: none; }
  .pair { display: grid; grid-column: 1; grid-row: 2; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .pair-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--rule); }
  .pair-imgs figure { margin: 0; position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: var(--rule); }
  .pair-imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pair-imgs img.contain { object-fit: contain; background: #fff; padding: 6px; }
  .pair-imgs .flag { left: 8px; top: 8px; font-size: 10px; padding: 5px 7px; }
  .pair-body { display: grid; gap: 12px; padding: 14px 16px 6px; }
  .pline { display: grid; gap: 4px; padding-left: 10px; border-left: 3px solid var(--us); }
  .pline.my { border-left-color: var(--my); }
  .pline h2 { margin: 0; font: 800 19px/1.15 var(--display); text-wrap: balance; }
  .pline .date { font-size: 12px; line-height: 1.6; }
  .pair details { border-top: 1px solid var(--rule); margin-inline: -16px; }
  .pair summary { cursor: pointer; padding: 12px 16px; font: 500 13px/1 var(--mono); color: var(--muted); list-style: none; }
  .pair summary::-webkit-details-marker { display: none; }
  .pair summary::after { content: " +"; }
  .pair details[open] summary::after { content: " −"; }
  .more-body { display: grid; gap: 12px; padding: 0 16px 16px; font-size: 16px; }
  .more-body p { margin: 0; }
  .more-body a:not(.film) { color: var(--muted); font: 500 12px/1 var(--mono); }
  .tag { font: 700 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; margin-right: 4px; vertical-align: 2px; }
  .tag.us { background: var(--us); color: #fff; }
  .tag.my { background: var(--my); color: #1a1300; }
  .era { justify-items: start; text-align: left; padding-block: 12px 0; padding-left: 30px; }
  .era strong, .era span { padding-inline: 0; }
  .filters { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
  .filters button { flex: none; }
  header { padding-block: 32px 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform .2s ease; }
  .card:hover { transform: translateY(-2px); }
}
</style>
</head>

    my: { date: "1 Jul 1975", iso: "1975-07-01", title: "Muhammad Ali fights in KL", text: "On 1 July, Muhammad Ali defends his world heavyweight title against Joe Bugner at Stadium Merdeka and wins on points after 15 rounds. Tun Abdul Razak is Prime Minister.", img: "img/my-1975.jpg", fit: "contain", link: "https://en.wikipedia.org/wiki/Muhammad_Ali", facts: ["PM: Tun Abdul Razak", "Stadium Merdeka"] }
  },
  {
    year: 1981,
    us: { iso: "1981-04-12", date: "12 Apr 1981", title: "The Space Shuttle flies", text: "Columbia launches from Florida on STS-1, the first flight of a reusable spacecraft.", img: "img/us-1981.jpg", link: "https://en.wikipedia.org/wiki/STS-1" },
    my: { date: "16 Jul 1981", iso: "1981-07-16", title: "Mahathir is three months away", text: "Hussein Onn is Prime Minister. On 16 July 1981 Dr Mahathir Mohamad takes over and stays for 22 years: Look East, Proton, the Twin Towers.", img: "img/my-1981.jpg", link: "https://en.wikipedia.org/wiki/Mahathir_Mohamad", facts: ["PM: Hussein Onn", "then Mahathir"] }
  },
  {
    year: 1986,
    us: { iso: "1986-01-28", date: "28 Jan 1986", title: "Challenger explodes", text: "The shuttle breaks apart 73 seconds after launch, killing all seven crew, including teacher Christa McAuliffe.", img: "img/us-1986.jpg", link: "https://en.wikipedia.org/wiki/Space_Shuttle_Challenger_disaster" },
    my: { date: "9 Jul 1985", iso: "1985-07-09", title: "The Proton Saga is on the road", text: "Malaysia's first national car launched in July 1985. Within a few years it holds most of the local car market.", img: "img/my-1986.jpg", link: "https://en.wikipedia.org/wiki/Proton_Saga", facts: ["PM: Mahathir", "Saga: RM17,000-ish"] }
  }
];

const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const MS = {
  1776: { us: ["Amerika mengisytiharkan kemerdekaan", "Tiga belas tanah jajahan British menandatangani Deklarasi Kemerdekaan di Philadelphia. Amerika Syarikat lahir."],
          my: ["Melaka milik Belanda", "Belanda menguasai Melaka sejak merampasnya daripada Portugis pada 1641. Kawasan lain di semenanjung ialah kesultanan Melayu: Johor, Kedah, Perak, Selangor, Terengganu dan lain-lain. British belum bertapak lagi.", ["Melaka: Belanda", "Belum ada British"]],
          film: "Seorang petani berperang dalam Perang Revolusi, bermula 1776" },
  1787: { us: ["Perlembagaan Amerika ditandatangani", "Perwakilan di Philadelphia menandatangani Perlembagaan. Ia masih perlembagaan negara itu hari ini."],
          my: ["Pulau Pinang baru jadi milik British", "Setahun sebelumnya, pada 11 Ogos 1786, Francis Light menaikkan bendera British di Pulau Pinang melalui perjanjian dengan Sultan Kedah. George Town ialah tapak pertama British di Tanah Melayu.", ["British: Pulau Pinang sahaja"]],
          film: "Kisah pengasas Amerika dalam bentuk muzikal" },
  1861: { us: ["Perang Saudara bermula", "Meriam Konfederasi menembak Fort Sumter. Empat tahun perang menyusul. Perang ini menamatkan perhambaan dan mengorbankan ratusan ribu askar."],
          my: ["Kuala Lumpur baru dibuka empat tahun lalu", "Pelombong bijih timah membuka KL pada 1857 di pertemuan Sungai Klang dan Sungai Gombak. Yap Ah Loy (dalam gambar), seorang pelombong, menjadi Kapitan Cina di situ pada 1868. Di Perak, kongsi gelap Cina mula bertempur dalam Perang Larut kerana bijih timah.", ["Negeri-Negeri Selat: Pulau Pinang, Melaka, Singapura"]],
          film: "Selatan Amerika semasa Perang Saudara" },
  1876: { us: ["Panggilan telefon pertama", "Alexander Graham Bell memanggil pembantunya di bilik sebelah: \"Mr. Watson, come here, I want to see you.\""],
          my: ["Residen British di Perak baru dibunuh", "Perjanjian Pangkor 1874 memaksa Perak menerima Residen British. Pada November 1875, Residen itu, J.W.W. Birch, dibunuh di Pasir Salak. Maharaja Lela digantung pada tahun berikutnya. (Dalam gambar: Birch.)", ["Perjanjian Pangkor 1874"]] },
  1903: { us: ["Wright bersaudara terbang", "Orville Wright terbang selama 12 saat di Kill Devil Hills, berhampiran Kitty Hawk, North Carolina. Ia penerbangan kapal terbang berkuasa yang pertama."],
          my: ["Negeri-Negeri Melayu Bersekutu, ditadbir dari KL", "Sejak 1896 British mentadbir Perak, Selangor, Negeri Sembilan dan Pahang bersama-sama dari Kuala Lumpur. Bangunan Sultan Abdul Samad dibuka pada 1897. Getah akan melonjak apabila rakyat Amerika mula membeli kereta.", ["NNMB sejak 1896", "Ibu kota: KL"]] },
  1929: { us: ["Wall Street runtuh", "Pada Selasa Hitam, pasaran saham runtuh. Kemelesetan Besar bermula."],
          my: ["Harga getah dan bijih timah jatuh", "Tanah Melayu hidup dengan menjual getah dan bijih timah, kebanyakannya kepada Amerika. Apabila permintaan Amerika jatuh, ladang dan lombong ditutup. Mulai Ogos 1930 British mengehadkan kemasukan pendatang Cina.", ["Tanah Melayu British", "Getah & bijih timah"]] },
  1941: { us: ["Pearl Harbor", "Kapal terbang Jepun menyerang armada Amerika di Hawaii. Amerika memasuki Perang Dunia Kedua."],
          my: ["Jepun mendarat di Kota Bharu dahulu", "Pendaratan Jepun di Kota Bharu, Kelantan bermula kira-kira sejam sebelum bom jatuh di Pearl Harbor (di sini sudah 8 Disember). KL jatuh pada Januari dan Singapura pada Februari 1942. Pendudukan berlarutan hingga 1945.", ["Pendudukan 1941–45"]],
          film: "Serangan itu sendiri" },
  1955: { us: ["Disneyland dibuka", "Walt Disney membuka taman tema pertamanya di Anaheim, California."],
          my: ["Pilihan raya pertama, kemudian Rundingan Baling", "Sepuluh hari kemudian Perikatan memenangi 51 daripada 52 kerusi dalam pilihan raya persekutuan pertama Tanah Melayu, dan Tunku Abdul Rahman menjadi Ketua Menteri. Pada 28 Disember beliau bertemu pemimpin komunis Chin Peng di Baling. Darurat berterusan hingga 1960.", ["Ketua Menteri: Tunku", "Darurat 1948–60"]] },
  1957: { us: ["Elvis dalam Jailhouse Rock", "Elvis Presley, bintang paling terkenal di Amerika, menayangkan filemnya Jailhouse Rock. Lagu temanya mendahului carta."],
          my: ["Merdeka!", "Tujuh minggu sebelumnya, pada 31 Ogos, Tunku Abdul Rahman membaca pengisytiharan di Stadium Merdeka dan melaungkan \"Merdeka!\" tujuh kali. Tanah Melayu merdeka. Sabah, Sarawak dan Singapura belum menyertainya.", ["PM: Tunku Abdul Rahman", "11 negeri"]],
          film: "Kisah hidup Elvis Presley" },
  1963: { us: ["JFK ditembak di Dallas", "Presiden John F. Kennedy dibunuh semasa menaiki kereta terbuka dalam perarakan di Dealey Plaza."],
          my: ["Malaysia baru berusia 67 hari", "Tanah Melayu, Singapura, Sabah dan Sarawak bergabung pada 16 September. Sukarno dari Indonesia membalas dengan Konfrontasi dan laungan \"Ganyang Malaysia\". Singapura masih salah sebuah negeri.", ["PM: Tunku Abdul Rahman", "14 negeri"]],
          film: "Siasatan tentang pembunuhan itu" },
  1969: { us: ["Manusia berjalan di Bulan", "Apollo 11 mendarat. Neil Armstrong dan Buzz Aldrin menjejakkan kaki di Bulan sambil kira-kira 600 juta orang menonton."],
          my: ["Dua bulan selepas 13 Mei", "Rusuhan kaum di Kuala Lumpur berlaku selepas pilihan raya Mei. Parlimen digantung dan negara ditadbir oleh Majlis Gerakan Negara (MAGERAN) di bawah Tun Abdul Razak.", ["Parlimen digantung", "Pemerintahan darurat"]],
          film: "Neil Armstrong dan Apollo 11" },
  1975: { us: ["Saigon jatuh", "Helikopter mengangkut rakyat Amerika terakhir dari bumbung ketika kereta kebal Vietnam Utara memasuki Saigon. Perang Vietnam tamat."],
          my: ["Muhammad Ali bertinju di KL", "Pada 1 Julai, Muhammad Ali mempertahankan gelaran juara heavyweight dunia menentang Joe Bugner di Stadium Merdeka dan menang mata selepas 15 pusingan. Tun Abdul Razak Perdana Menteri.", ["PM: Tun Abdul Razak", "Stadium Merdeka"]] },
  1981: { us: ["Kapal angkasa ulang-alik terbang", "Columbia dilancarkan dari Florida dalam misi STS-1, penerbangan pertama kapal angkasa yang boleh diguna semula."],
          my: ["Mahathir tiga bulan lagi", "Hussein Onn Perdana Menteri. Pada 16 Julai 1981 Dr Mahathir Mohamad mengambil alih dan kekal selama 22 tahun: Dasar Pandang ke Timur, Proton, Menara Berkembar.", ["PM: Hussein Onn", "kemudian Mahathir"]] },
  1986: { us: ["Challenger meletup", "Kapal angkasa itu hancur 73 saat selepas pelancaran, mengorbankan ketujuh-tujuh anak kapal, termasuk guru Christa McAuliffe."],
          my: ["Proton Saga sudah di jalan raya", "Kereta nasional pertama Malaysia dilancarkan pada Julai 1985. Dalam beberapa tahun ia menguasai sebahagian besar pasaran kereta tempatan.", ["PM: Mahathir", "Saga: sekitar RM17,000"]] }
};

const UI = {
  en: {
    kicker: "America · Malaysia · 1776–1986", ages: "America is 250 years old. We are 69.", usWas: "USA was 181 years old",
    footer: "Photos from Wikimedia Commons and Wikipedia. Movie posters are low-resolution copies used to identify each film. Each card links to its source article. Some photos show the place or topic later, not in that year. Dates are local to where each event happened.",
    all: "All", readMore: "Read more", readWiki: "Read on Wikipedia →", movie: "The movie", usa: "USA",
    usAge: n => n === 0 ? "USA: day one" : `USA: ${n} yrs old`, usAgeShort: n => n === 0 ? "USA day one" : `USA ${n} yrs old`,
    merdekaIn: n => `Merdeka in ${n} yrs`,
    year: "year", month: "month", day: "day", earlier: "earlier", later: "later", about: "About", sameDay: "Same day",
    plural: (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`,
    gapText: { period: "Same period", hour: "About 1 hour earlier", weeks7: "About 7 weeks earlier" }
  },
  ms: {
    kicker: "Amerika · Malaysia · 1776–1986", ages: "Amerika berusia 250 tahun. Kita 69.", usWas: "Amerika sudah 181 tahun",
    footer: "Gambar daripada Wikimedia Commons dan Wikipedia. Poster filem ialah salinan resolusi rendah untuk mengenal pasti setiap filem. Setiap kad memaut ke artikel sumbernya. Sesetengah gambar menunjukkan tempat atau topik itu pada tahun kemudian. Tarikh mengikut waktu tempatan di tempat peristiwa berlaku.",
    all: "Semua", readMore: "Baca lagi", readWiki: "Baca di Wikipedia →", movie: "Filemnya", usa: "Amerika",
    usAge: n => n === 0 ? "Amerika: hari pertama" : `Amerika: ${n} tahun`, usAgeShort: n => n === 0 ? "Amerika hari pertama" : `Amerika ${n} tahun`,
    merdekaIn: n => `Merdeka dalam ${n} tahun`,
    year: "tahun", month: "bulan", day: "hari", earlier: "lebih awal", later: "kemudian", about: "Kira-kira", sameDay: "Hari yang sama",
    plural: (n, w) => `${n} ${w}`,
    gapText: { period: "Tempoh yang sama", hour: "Kira-kira 1 jam lebih awal", weeks7: "Kira-kira 7 minggu lebih awal" }
  }
};
const ERA_MS = {
  before: ["Sebelum British", "Kesultanan Melayu dan Melaka Belanda"],
  british: ["Tanah Melayu British", "1786–1941"],
  war: ["Perang dan Darurat", "Pendudukan Jepun, kemudian pemberontakan komunis"],
  malaya: ["Persekutuan Tanah Melayu", "Merdeka, sebelum Malaysia"],
  malaysia: ["Malaysia", "Sejak 16 September 1963"]
};
const MONTHS_MS = { Mar: "Mac", May: "Mei", Aug: "Ogos", Oct: "Okt", Dec: "Dis" };

let lang = "en";
try { if (localStorage.getItem("lang") === "ms") lang = "ms"; } catch (err) { /* storage unavailable */ }
const T = () => UI[lang];
const fmtDate = d => lang === "ms" ? d.replace(/\b(Mar|May|Aug|Oct|Dec)\b/g, m => MONTHS_MS[m] ?? m) : d;

function loc(e, side) {
  const base = e[side];
  const tr = lang === "ms" ? MS[e.year]?.[side] : undefined;
  return { ...base, title: tr?.[0] ?? base.title, text: tr?.[1] ?? base.text, facts: tr?.[2] ?? base.facts, date: fmtDate(base.date) };
}
function filmNote(e) {
  return (lang === "ms" ? MS[e.year]?.film : undefined) ?? e.film.note;
}

const ERAS = [
  { id: "before", from: 1776, title: "Before the British", sub: "Sultanates and Dutch Melaka" },
  { id: "british", from: 1786, title: "British Malaya", sub: "1786–1941" },
  { id: "war", from: 1941, title: "War and Emergency", sub: "Japanese occupation, then the communist insurgency" },
  { id: "malaya", from: 1957, title: "Malaya", sub: "Independent, before Malaysia" },
  { id: "malaysia", from: 1963, title: "Malaysia", sub: "From 16 September 1963" }
];
const eraOf = year => ERAS.filter(x => year >= x.from).pop();
const eraText = era => lang === "ms" ? ERA_MS[era.id] : [era.title, era.sub];

function mySideLabel(year) {
  return year < 1963 ? "Tanah Melayu" : "Malaysia";
}

function parseIso(iso) {
  const [y, m = 1, d = 1] = iso.split("-").map(Number);
  return { y, m, d, exact: iso.length === 10 };
}
function gapLabel(e) {
  const t = T();
  if (e.my.gapText) return t.gapText[e.my.gapText];
  const a = parseIso(e.us.iso), b = parseIso(e.my.iso);
  const earlier = b.y < a.y || (b.y === a.y && (b.m < a.m || (b.m === a.m && b.d < a.d)));
  const [from, to] = earlier ? [b, a] : [a, b];
  const side = earlier ? t.earlier : t.later;
  if (!b.exact) return `${t.about} ${t.plural(to.y - from.y, t.year)} ${side}`;
  let y = to.y - from.y, m = to.m - from.m, d = to.d - from.d;
  if (d < 0) { m -= 1; d += new Date(Date.UTC(to.y, to.m - 1, 0)).getUTCDate(); }
  if (m < 0) { y -= 1; m += 12; }
  if (y === 0 && m === 0 && d === 0) return t.sameDay;
  if (y > 0) return `${t.plural(y, t.year)}${m ? " " + t.plural(m, t.month) : ""} ${side}`;
  if (m > 0) return `${t.plural(m, t.month)}${d ? " " + t.plural(d, t.day) : ""} ${side}`;
  return `${t.plural(d, t.day)} ${side}`;
}

function filmBlock(e) {
  if (!e.film) return "";
  return `<a class="film" href="${e.film.link}" target="_blank" rel="noopener"><img src="img/film/${e.year}.jpg" alt="${escapeHtml(e.film.title)} poster" loading="lazy"><div><span>${T().movie}</span>${escapeHtml(e.film.title)} (${e.film.year})<em>${escapeHtml(filmNote(e))}</em></div></a>`;
}
const myChips = (d, year) => [...d.facts, year < 1957 ? T().merdekaIn(1957 - year) : `Merdeka +${year - 1957}`];

function card(side, e, year) {
  const d = loc(e, side);
  const t = T();
  const flag = side === "us" ? t.usa : mySideLabel(year);
  const chips = side === "us" ? [t.usAge(year - 1776)] : myChips(d, year);
  return `
    <article class="card ${side}">
      <figure>
        <img class="${d.fit || ""}" src="${d.img}" alt="${escapeHtml(d.title)}" loading="lazy">
        <span class="flag">${flag}</span>
      </figure>
      <div class="body">
        ${side === "us" ? `<div class="date">${d.date}</div>` : `<div class="date">${d.date} <span class="gap">${gapLabel(e)}</span></div>`}
        <h2>${escapeHtml(d.title)}</h2>
        <p>${escapeHtml(d.text)}</p>
        ${side === "us" ? filmBlock(e) : ""}
        <div class="facts">${chips.map(f => `<span>${escapeHtml(f)}</span>`).join("")}</div>
        <a class="more" href="${d.link}" target="_blank" rel="noopener">${t.readWiki}</a>
      </div>
    </article>`;
}

function pair(e) {
  const us = loc(e, "us"), my = loc(e, "my"), year = e.year, t = T();
  return `
    <article class="pair">
      <div class="pair-imgs">
        <figure class="us"><img class="${us.fit || ""}" src="${us.img}" alt="${escapeHtml(us.title)}" loading="lazy"><span class="flag">${t.usa}</span></figure>
        <figure class="my"><img class="${my.fit || ""}" src="${my.img}" alt="${escapeHtml(my.title)}" loading="lazy"><span class="flag">${mySideLabel(year)}</span></figure>
      </div>
      <div class="pair-body">
        <div class="pline us">
          <div class="date">${us.date} · ${t.usAgeShort(year - 1776)}</div>
          <h2>${escapeHtml(us.title)}</h2>
        </div>
        <div class="pline my">
          <div class="date">${my.date} <span class="gap">${gapLabel(e)}</span></div>
          <h2>${escapeHtml(my.title)}</h2>
        </div>
        <details>
          <summary>${t.readMore}</summary>
          <div class="more-body">
            <p><b class="tag us">${t.usa}</b> ${escapeHtml(us.text)} <a href="${us.link}" target="_blank" rel="noopener">Wikipedia</a></p>
            ${filmBlock(e)}
            <p><b class="tag my">${mySideLabel(year)}</b> ${escapeHtml(my.text)} <a href="${my.link}" target="_blank" rel="noopener">Wikipedia</a></p>
            <div class="facts">${myChips(my, year).map(f => `<span>${escapeHtml(f)}</span>`).join("")}</div>
          </div>
        </details>
      </div>
    </article>`;
}

let currentEra = "all";
function render() {
  let html = "", lastEra = null;
  for (const e of EVENTS) {
    const era = eraOf(e.year);
    if (currentEra !== "all" && era.id !== currentEra) continue;
    if (era !== lastEra) {
      const [title, sub] = eraText(era);
      html += `<div class="era"><strong>${title}</strong><span>${sub}</span></div>`;
      lastEra = era;
    }
    html += `
    <section class="row" aria-label="${e.year}">
      <div class="year">${e.year}</div>
      ${card("us", e, e.year)}
      ${card("my", e, e.year)}
      ${pair(e)}
    </section>`;
  }
  document.getElementById("timeline").innerHTML = html;
}

const filters = document.getElementById("filters");
function renderFilters() {
  filters.innerHTML = [["all", T().all], ...ERAS.map(x => [x.id, eraText(x)[0]])]
    .map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === currentEra}">${l}</button>`).join("");
}
filters.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  currentEra = b.dataset.v;
  filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderFilters();
  render();
}
document.getElementById("lang").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (err) { /* storage unavailable */ }
  applyLang();
});
applyLang();
</script>
</body>
</html>
